name: Create Release

# Creates the version tag + GitHub release from a dispatch, for environments
# that can push branches but not tags (e.g. remote agent sessions). A release
# created with GITHUB_TOKEN doesn't fire `on: release` workflows, so this
# calls publish.yml as a reusable workflow afterwards.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create (e.g. v1.2.3); must match package.json on the target ref"
        required: true
      notes:
        description: "Release notes (markdown)"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v${PACKAGE_VERSION}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
          fi

  assets:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag }}
