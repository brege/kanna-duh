name: Create Release

# Creates the version tag + GitHub release from a dispatch, for environments
# that can push branches but not tags (e.g. remote agent sessions). A release
# created with GITHUB_TOKEN doesn't fire `on: release` workflows, so this
# explicitly chains into publish.yml afterwards.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create (e.g. v1.2.3); must match package.json on the target ref"
        required: true
      notes:
        description: "Release notes (markdown)"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v${PACKAGE_VERSION}"

      - name: Create release (creates the tag at this commit)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"

      - name: Trigger release asset build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run publish.yml -f tag="$TAG"
