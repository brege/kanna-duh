name: Publish release assets

# Runs when a release is published by a user. Releases created with the
# repo's GITHUB_TOKEN (the release.yml workflow) don't emit workflow-
# triggering events, so release.yml chains into this via workflow_dispatch.
# Builds the client bundles, then uploads the install tarball and the
# export viewer assets to the GitHub release. Nothing goes to npm.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build assets for (e.g. v1.2.3)"
        required: true

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"

      - run: bun run build

      - name: Pack install tarball
        run: |
          bun pm pack --destination release-assets
          mv release-assets/kanna-duh-*.tgz release-assets/kanna-duh.tgz

      - run: bun run prepare:export-viewer-release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" release-assets/kanna-duh.tgz dist/export-viewer-release-assets/* --clobber
